[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skolyoz-metrics"
version = "0.1.0"
description = "Metrics, benchmarks and consistency checks for the Skolyoz screening project"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "jsonschema>=4.20", "pillow>=10"]
bench = ["numpy>=1.26", "torch>=2.2", "torchvision>=0.17", "ultralytics>=8.4,<9", "ai-edge-litert>=1.0"]

[project.scripts]
skolyoz-metrics = "skolyoz_metrics.cli:main"

[tool.setuptools.packages.find]
include = ["skolyoz_metrics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
# The research scripts (scripts/) are a frozen record of the experiments and
# are intentionally not linted or reformatted.
extend-exclude = ["scripts", "android"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
