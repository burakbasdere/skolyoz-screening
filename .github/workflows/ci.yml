name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint, testler, metrik denetimi (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      # Şema + alanlar arası tutarlılık + "üretilen dokümanlar JSON ile aynı mı".
      - run: python -m skolyoz_metrics check
      # Python referansı ile Kotlin altın verisinin eşdeğerlik testini de içerir.
      - run: pytest

  bench-smoke:
    name: Mimari testleri ve benchmark duman koşusu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/bench.txt
      - name: Önce yalnızca CPU torch kur, sonraki adım onu korusun
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements/dev.txt -r requirements/bench.txt
      # Parametre sayıları, FLOP sayacı ve çıktı şekilleri yayımlanan metriklerle eşleşmeli.
      - run: pytest tests/test_bench_arch.py tests/test_bench_tflite.py tests/test_demo.py
      - name: Benchmark (CPU, sentetik girdi)
        run: python -m skolyoz_metrics bench arch --devices cpu --warmup 5 --repeat 30 --out "$RUNNER_TEMP/arch-ci.json"
      # Paylaşımlı runner'lar gürültülü: sonuç commit edilmez, artifact olarak saklanır.
      - uses: actions/upload-artifact@v4
        with:
          name: arch-benchmark-ci
          path: ${{ runner.temp }}/arch-ci.json
