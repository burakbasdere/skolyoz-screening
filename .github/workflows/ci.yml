name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Lint, tests, metrics check (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.txt
      - run: pip install -r requirements/dev.txt
      - run: ruff check .
      # Schema + cross-field consistency + "generated docs match the JSON".
      - run: python -m skolyoz_metrics check
      # Includes the Python-reference vs Kotlin golden-data parity test.
      - run: pytest

  bench-smoke:
    name: Architecture tests and benchmark smoke run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements/bench.txt
      - name: Install CPU-only torch first so the next step keeps it
        run: pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -r requirements/dev.txt -r requirements/bench.txt
      # Parameter counts, FLOP counter and output shapes must match the published metrics.
      - run: pytest tests/test_bench_arch.py tests/test_bench_tflite.py
      - name: Benchmark (CPU, synthetic input)
        run: python -m skolyoz_metrics bench arch --devices cpu --warmup 5 --repeat 30 --out "$RUNNER_TEMP/arch-ci.json"
      # Shared runners are noisy, so the result is kept as an artifact, not committed.
      - uses: actions/upload-artifact@v4
        with:
          name: arch-benchmark-ci
          path: ${{ runner.temp }}/arch-ci.json
