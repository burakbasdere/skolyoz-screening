name: Android

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      # gradle-wrapper.jar commit edilmiş bir ikili dosya: resmi olduğunu doğrula.
      - uses: gradle/actions/wrapper-validation@v5
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      # Android SDK, GitHub'ın ubuntu imajında hazır (ANDROID_HOME); ayrı kurulum gerekmiyor.
      - uses: gradle/actions/setup-gradle@v5
      - run: chmod +x ./gradlew
      # JVM testleri cihaz ve model dosyası istemez; altın veri CSV'leri depoda.
      - run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-reports
          path: android/app/build/reports/tests/
          if-no-files-found: ignore
